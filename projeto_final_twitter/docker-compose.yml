services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-twitterclone}
      POSTGRES_USER: ${POSTGRES_USER:-twitterclone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - twitterclone_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: sh -c "python manage.py migrate && gunicorn twitterclone.wsgi:application --bind 0.0.0.0:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-twitter.axionwebdigital.com.br}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://twitter.axionwebdigital.com.br}
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-twitterclone}
      POSTGRES_USER: ${POSTGRES_USER:-twitterclone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: "5432"
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - twitterclone_media:/app/media

volumes:
  twitterclone_postgres:
  twitterclone_media:
