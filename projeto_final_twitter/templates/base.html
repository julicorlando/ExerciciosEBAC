<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Twitter Clone EBAC{% endblock %}</title>
  <style>
*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;background:#000;color:#e7e9ea;font-family:Arial,Helvetica,sans-serif}a{color:inherit;text-decoration:none}button,input,textarea{font:inherit}.app-shell{display:flex;max-width:1180px;margin:0 auto;min-height:100vh}.sidebar{width:260px;padding:18px 22px;position:sticky;top:0;height:100vh;border-right:1px solid #2f3336}.brand{font-size:34px;display:inline-block;margin-bottom:24px}.sidebar nav{display:flex;flex-direction:column;gap:8px}.sidebar nav a,.link-button{display:flex;gap:14px;align-items:center;padding:12px 14px;border-radius:999px;background:none;border:0;color:#e7e9ea;font-size:20px;cursor:pointer}.sidebar nav a:hover,.link-button:hover{background:#181818}.main-column{width:640px;border-right:1px solid #2f3336;min-height:100vh}.auth-column{width:min(520px,calc(100vw - 32px));margin:auto;border:0}.page-header{min-height:58px;padding:10px 16px;border-bottom:1px solid #2f3336;display:flex;align-items:center;gap:18px;position:sticky;top:0;background:rgba(0,0,0,.88);backdrop-filter:blur(10px);z-index:10}.page-header h1{font-size:20px;margin:0}.muted{color:#71767b}.composer{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid #2f3336}.composer-form{flex:1}.composer textarea{width:100%;min-height:84px;border:0;resize:vertical;background:#000;color:#e7e9ea;font-size:20px;outline:0;padding:10px 0}.composer-actions{display:flex;align-items:center;justify-content:space-between;color:#71767b;font-size:13px}.avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;background:#16181c}.avatar.large{width:112px;height:112px;border:4px solid #000}.avatar.placeholder{display:flex;align-items:center;justify-content:center;background:#1d9bf0;color:#fff;font-weight:700}.primary,.outline{border-radius:999px;border:1px solid transparent;padding:10px 18px;font-weight:700;cursor:pointer}.primary{background:#eff3f4;color:#0f1419}.primary:hover{background:#d7dbdc}.primary.small{padding:8px 18px;background:#1d9bf0;color:#fff}.outline{background:transparent;color:#e7e9ea;border-color:#536471}.button-link{display:inline-block;text-align:center}.block{display:block;margin-top:16px}.post-card{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid #2f3336}.post-body{min-width:0;flex:1}.post-meta{display:flex;gap:6px;flex-wrap:wrap}.post-meta span{color:#71767b}.post-content{font-size:15px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}.post-actions{display:flex;gap:34px;align-items:center;color:#71767b;font-size:14px}.post-actions form{margin:0}.action-button,.danger-link{background:none;border:0;padding:0;color:#71767b;cursor:pointer}.action-button:hover{color:#f91880}.danger-link:hover{color:#f4212e}.comments{margin-top:12px;border-top:1px solid #202327;padding-top:8px}.comments p{margin:6px 0;font-size:14px}.comment-form{display:flex;gap:8px;margin-top:10px}.comment-form input{flex:1;background:#16181c;border:1px solid #2f3336;border-radius:999px;padding:8px 12px;color:#e7e9ea}.comment-form button{border:0;background:none;color:#1d9bf0;cursor:pointer}.empty-state{padding:46px 24px;text-align:center}.profile-card{padding:22px 16px;border-bottom:1px solid #2f3336}.profile-top{display:flex;justify-content:space-between;align-items:flex-start}.profile-card h2{margin:14px 0 2px}.profile-card p{line-height:1.45}.follow-counts{display:flex;gap:18px;margin-top:14px;color:#71767b}.follow-counts strong{color:#e7e9ea}.people-list{display:flex;flex-direction:column}.person-row{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid #2f3336}.person-row:hover{background:#080808}.person-row>div:last-child{display:flex;flex-direction:column;gap:3px}.person-row p{margin:5px 0 0;line-height:1.35}.form-card,.auth-card{padding:28px;border:1px solid #2f3336;border-radius:18px;margin:28px auto;max-width:540px;background:#000}.auth-card{margin-top:8vh}.auth-logo{font-size:44px;text-align:center}.auth-card h1{font-size:26px}.stack-form p{display:flex;flex-direction:column;gap:7px}.stack-form input,.stack-form textarea{width:100%;background:#000;color:#e7e9ea;border:1px solid #536471;border-radius:8px;padding:12px}.stack-form input[type=file]{padding:8px}.stack-form .helptext,.stack-form ul{color:#71767b;font-size:13px;line-height:1.35}.stack-form .errorlist{color:#f4212e}.messages{padding:0 16px}.message{margin:10px 0;padding:10px 12px;border-radius:8px;background:#16181c}.message.success{border-left:3px solid #00ba7c}.message.error{border-left:3px solid #f4212e}.message.info{border-left:3px solid #1d9bf0}@media(max-width:900px){.sidebar{width:78px;padding:16px 10px}.sidebar span{display:none}.sidebar nav a,.link-button{justify-content:center;font-size:22px}.main-column{width:calc(100vw - 78px)}}@media(max-width:620px){.app-shell{display:block}.sidebar{width:100%;height:auto;position:fixed;bottom:0;top:auto;z-index:20;border-right:0;border-top:1px solid #2f3336;background:#000;padding:6px}.sidebar .brand{display:none}.sidebar nav{flex-direction:row;justify-content:space-around}.sidebar form{display:none}.sidebar nav a{padding:8px 14px}.main-column{width:100%;border:0;padding-bottom:64px}.page-header{top:0}.post-actions{gap:22px}.form-card,.auth-card{margin:14px;border-radius:14px}.avatar.large{width:92px;height:92px}}
  </style>
</head>
<body>
  <div class="app-shell">
    {% if user.is_authenticated %}
      <aside class="sidebar">
        <a class="brand" href="{% url 'feed' %}" aria-label="Página inicial">𝕏</a>
        <nav>
          <a href="{% url 'feed' %}">🏠 <span>Início</span></a>
          <a href="{% url 'user-list' %}">🔎 <span>Explorar</span></a>
          <a href="{% url 'profile-detail' user.username %}">👤 <span>Perfil</span></a>
          <a href="{% url 'profile-edit' %}">⚙️ <span>Configurações</span></a>
        </nav>
        <form action="{% url 'logout' %}" method="post">
          {% csrf_token %}
          <button class="link-button" type="submit">↪ <span>Sair</span></button>
        </form>
      </aside>
    {% endif %}

    <main class="main-column {% if not user.is_authenticated %}auth-column{% endif %}">
      {% if messages %}
        <div class="messages">
          {% for message in messages %}<div class="message {{ message.tags }}">{{ message }}</div>{% endfor %}
        </div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
