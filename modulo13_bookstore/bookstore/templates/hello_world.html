<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookstore - EBAC</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #1f2937;
        }
        main {
            width: min(680px, calc(100% - 48px));
            padding: 40px;
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
        }
        h1 { margin-top: 0; }
        code {
            padding: 4px 8px;
            border-radius: 6px;
            background: #eef2ff;
        }
    </style>
</head>
<body>
    <main>
        <h1>{{ status }}</h1>
        <p>Projeto Bookstore desenvolvido durante o curso Full Stack Python da EBAC.</p>
        <p>Commit em execução: <code>{{ commit }}</code></p>
        <p>API: <a href="/api/products/">/api/products/</a></p>
        <p>Health check: <a href="/api/health/">/api/health/</a></p>
    </main>
</body>
</html>
