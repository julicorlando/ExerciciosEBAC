name: Módulo 15 - Paginação DRF

on:
  push:
    branches:
      - modulo15-paginacao-drf
  pull_request:
    paths:
      - "modulo13_bookstore/**"
      - ".github/workflows/modulo15-paginacao.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modulo13_bookstore

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Poetry
        run: pip install poetry

      - name: Instalar dependências
        run: poetry install --no-interaction

      - name: Verificar migrations pendentes
        run: poetry run python manage.py makemigrations --check --dry-run

      - name: Django check
        run: poetry run python manage.py check

      - name: Executar testes
        run: poetry run python manage.py test
