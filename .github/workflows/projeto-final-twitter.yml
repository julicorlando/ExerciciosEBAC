name: Projeto Final - Twitter Clone

on:
  push:
    branches:
      - projeto-final-twitter-clone
  pull_request:
    paths:
      - "projeto_final_twitter/**"
      - ".github/workflows/projeto-final-twitter.yml"

jobs:
  test:
    name: Django, API e testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projeto_final_twitter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Django system check
        run: python manage.py check

      - name: Executar testes
        run: python manage.py test

  docker:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar Docker Compose
        run: docker compose -f projeto_final_twitter/docker-compose.yml config

      - name: Build da imagem
        run: docker build -t twitter-clone-ebac:ci ./projeto_final_twitter

      - name: Validar Django dentro da imagem
        run: docker run --rm twitter-clone-ebac:ci python manage.py check
