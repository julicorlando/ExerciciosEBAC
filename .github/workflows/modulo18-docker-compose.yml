name: Módulo 18 - Docker Compose e PostgreSQL

on:
  push:
    branches:
      - modulo18-docker-compose-postgres
  pull_request:
    paths:
      - "modulo13_bookstore/**"
      - ".github/workflows/modulo18-docker-compose.yml"

jobs:
  compose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Subir aplicação e PostgreSQL
        run: docker compose -f modulo13_bookstore/docker-compose.yml up -d --build

      - name: Aguardar aplicação ficar disponível
        shell: bash
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/api/health/; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f modulo13_bookstore/docker-compose.yml logs
          exit 1

      - name: Django check usando PostgreSQL
        run: docker compose -f modulo13_bookstore/docker-compose.yml exec -T web python manage.py check

      - name: Testes usando PostgreSQL
        run: docker compose -f modulo13_bookstore/docker-compose.yml exec -T web python manage.py test

      - name: Encerrar serviços
        if: always()
        run: docker compose -f modulo13_bookstore/docker-compose.yml down -v
